<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="output.css" rel="stylesheet">

<body>
    <!-- Safelist for Tailwind to preserve hover ring colors -->
    <div class="hidden hover:ring-neon-green hover:ring-neon-orange hover:ring-neon-purple"></div>

    <div id="background-image" class="absolute inset-0 bg-cover bg-center" style="background-image: url('public/images/background.jpeg');"></div>
    <div id="background-overlay" class="absolute inset-0 bg-black opacity-0 transition-opacity duration-500 backdrop-blur-xs scale-100"></div>
    <nav class="bg-gray-800 p-4 relative opacity-80" id="navbar"></nav>
    
    <div class="flex z-10"> 
        <aside id="sidebar" class="w-1/4 h-screen bg-gray-800 p-4 flex flex-col overflow-hidden" style="background-color: rgba(36, 47, 68, 0.7);"></aside>   
        <main id="app" class="w-3/4 p-4 relative z-10"></main>
    </div>
    <input type="hidden" id="googleClientId" data-google-client-id="{{GOOGLE_CLIENT_ID}}" />

   <script type="module" src="main.js"></script>
