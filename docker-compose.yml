version: '3'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - app-data:/app/data
    ports:
      - "3000:3000"
    container_name: front

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - app-data:/app/data
    ports:
    - "3001:3000"
    container_name: back

volumes:
  app-data: